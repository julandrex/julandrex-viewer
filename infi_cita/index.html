<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Julandrex — lien remplacé</title>
<meta http-equiv="refresh" content="3;url=https://julandrex.github.io/julandrex-viewer/">
<style>
  :root{--bg:#0f2847;--t1:#e2e8f0;--t2:#94a3b8;--acc:#c9983a;}
  @media (prefers-color-scheme: light){:root{--bg:#f8fafc;--t1:#0f172a;--t2:#475569;--acc:#9a6b12;}}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--t1);
       font-family:Arial,Helvetica,sans-serif;padding:16px;box-sizing:border-box;text-align:center;}
  h1{color:var(--acc);font-size:22px;margin:0 0 10px;} p{color:var(--t2);font-size:15px;line-height:1.5;margin:6px 0;}
  a{color:var(--acc);font-weight:700;}
</style>
</head>
<body>
<main>
  <h1>Julandrex</h1>
  <p>Ce lien n'est plus utilisé.</p>
  <p>Le planning se consulte désormais à l'adresse unique :<br><a href="https://julandrex.github.io/julandrex-viewer/">julandrex.github.io/julandrex-viewer</a></p>
  <p>Redirection automatique dans quelques secondes…</p>
</main>
<script>
// Ancienne application installée sur ce chemin : on désinstalle son service hors ligne (lien remplacé le 28/10/2026)
try{ if(navigator.serviceWorker){ navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){
  if(r.scope.indexOf(location.pathname.replace(/[^/]*$/,''))>=0&&r.scope!==location.origin+'/julandrex-viewer/') r.unregister(); }); }); } }catch(e){}
</script>
</body>
</html>
