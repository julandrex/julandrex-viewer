<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Julandrex — Copier le mot de passe</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:Arial,sans-serif;background:#0f2847;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
  .card{background:#1e3a5f;border-radius:16px;padding:32px;width:100%;max-width:440px;text-align:center;}
  h1{color:#c9983a;font-size:18px;margin-bottom:8px;letter-spacing:1px;}
  .sub{color:#94a3b8;font-size:13px;margin-bottom:24px;}
  .pwd-box{background:#0f2847;border:2px solid #c9983a;border-radius:10px;padding:18px;margin:0 0 8px;position:relative;}
  .pwd{color:#c9983a;font-family:monospace;font-size:18px;font-weight:700;letter-spacing:2px;word-break:break-all;user-select:all;-webkit-user-select:all;}
  .copy-btn{margin-top:16px;background:#c9983a;color:#0f2847;border:none;border-radius:8px;padding:13px 28px;font-size:15px;font-weight:700;cursor:pointer;width:100%;transition:opacity .15s;}
  .copy-btn:hover{opacity:.88;}
  .copy-btn.copied{background:#22c55e;color:#fff;}
  .hint{color:#64748b;font-size:12px;margin-top:10px;}
  .viewer-btn{display:inline-block;margin-top:20px;background:transparent;border:1px solid #c9983a;color:#c9983a;border-radius:8px;padding:11px 24px;font-size:14px;font-weight:600;text-decoration:none;transition:all .15s;}
  .viewer-btn:hover{background:#c9983a;color:#0f2847;}
  .logo{color:#c9983a;font-size:13px;font-weight:700;letter-spacing:1px;margin-bottom:4px;}
  .hosp{color:#64748b;font-size:11px;margin-bottom:24px;}
  .status{color:#22c55e;font-size:13px;margin-top:8px;min-height:18px;}
  .err{color:#ef4444;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">JULANDREX</div>
  <div class="hosp" id="hosp"></div>
  <h1>🔐 Votre mot de passe temporaire</h1>
  <div class="sub">Copiez-le avant de vous connecter au viewer</div>
  <div class="pwd-box">
    <div class="pwd" id="pwd">—</div>
  </div>
  <div class="hint">Cliquez sur le texte pour le sélectionner, ou utilisez le bouton ci-dessous</div>
  <button class="copy-btn" id="copy-btn" onclick="copyPwd()">📋 Copier le mot de passe</button>
  <div class="status" id="status"></div>
  <a class="viewer-btn" id="viewer-link" href="https://julandrex.github.io/julandrex-viewer/" target="_blank">
    📱 Accéder au planning →
  </a>
</div>
<script>
function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}
function copyPwd(){
  const pwd = document.getElementById('pwd').textContent;
  if(!pwd||pwd==='—') return;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(pwd).then(()=>{
      const btn=document.getElementById('copy-btn');
      btn.textContent='✅ Copié !';
      btn.classList.add('copied');
      document.getElementById('status').textContent='Mot de passe copié dans le presse-papier.';
      setTimeout(()=>{btn.textContent='📋 Copier le mot de passe';btn.classList.remove('copied');},3000);
    }).catch(fallback);
  } else { fallback(); }
}
function fallback(){
  const el=document.getElementById('pwd');
  const sel=window.getSelection();
  const range=document.createRange();
  range.selectNodeContents(el);
  sel.removeAllRanges();
  sel.addRange(range);
  try{
    document.execCommand('copy');
    document.getElementById('status').textContent='Mot de passe sélectionné — appuyez sur Ctrl+C (ou Cmd+C) pour copier.';
  }catch(e){
    document.getElementById('status').innerHTML='<span class="err">Sélectionnez manuellement le texte ci-dessus et copiez avec Ctrl+C.</span>';
  }
}
window.addEventListener('DOMContentLoaded',()=>{
  const pwd=getParam('p');
  const url=getParam('url');
  const hosp=getParam('h');
  if(pwd){
    document.getElementById('pwd').textContent=pwd;
    // Auto-copy on load
    setTimeout(()=>copyPwd(), 400);
  } else {
    document.getElementById('pwd').textContent='Lien invalide';
    document.getElementById('copy-btn').disabled=true;
    document.getElementById('status').innerHTML='<span class="err">Paramètre manquant dans le lien.</span>';
  }
  if(url) document.getElementById('viewer-link').href=decodeURIComponent(url);
  if(hosp) document.getElementById('hosp').textContent=hosp;
});
</script>
</body>
</html>
